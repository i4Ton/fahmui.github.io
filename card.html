<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💌 ข้อความพิเศษ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Dancing+Script:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffecd2);
      font-family: 'Mitr', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ---- Floating hearts background ---- */
    .bg-hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .bg-heart {
      position: absolute;
      font-size: 1.4rem;
      animation: floatUp linear infinite;
      opacity: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0.7; }
      100% { transform: translateY(-10vh)  rotate(360deg); opacity: 0; }
    }

    /* ---- Lock Screen ---- */
    #lockScreen {
      position: relative; z-index: 10;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 48px 40px 40px;
      box-shadow: 0 20px 60px rgba(255,100,130,0.25);
      text-align: center;
      max-width: 360px; width: 90%;
      animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .lock-icon {
      font-size: 4rem;
      animation: wiggle 2s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%,100% { transform: rotate(-5deg); }
      50%      { transform: rotate(5deg);  }
    }

    #lockScreen h2 {
      margin: 14px 0 6px;
      font-size: 1.4rem;
      color: #d63a6e;
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
    }
    #lockScreen p { color: #aaa; font-size: 0.85rem; margin-bottom: 24px; }

    .input-wrap { position: relative; margin-bottom: 16px; }
    #pwInput {
      width: 100%; padding: 14px 48px 14px 18px;
      border: 2px solid #f8aec0;
      border-radius: 50px;
      font-size: 1rem;
      font-family: 'Mitr', sans-serif;
      outline: none;
      transition: border 0.3s;
      background: #fff5f7;
      color: #555;
      letter-spacing: 3px;
    }
    #pwInput:focus { border-color: #e8538c; }
    #togglePw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 1.2rem; line-height: 1;
    }

    #unlockBtn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #f953c6, #b91d73);
      color: #fff; border: none; border-radius: 50px;
      font-size: 1.05rem; font-family: 'Mitr', sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(185,29,115,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #unlockBtn:hover  { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(185,29,115,0.4); }
    #unlockBtn:active { transform: scale(0.97); }

    #errorMsg {
      margin-top: 12px; color: #e84393; font-size: 0.85rem;
      height: 20px; transition: opacity 0.3s;
    }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }

    /* ---- Card Screen ---- */
    #cardScreen {
      display: none;
      position: relative; z-index: 10;
      text-align: center;
      max-width: 420px; width: 95%;
      animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1);
    }

    .envelope {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 44px 36px 36px;
      box-shadow: 0 24px 64px rgba(255,80,120,0.28);
      position: relative;
      overflow: hidden;
    }
    .envelope::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #f953c6, #ff758c, #ff7eb3, #f953c6);
      background-size: 200% 100%;
      animation: gradMove 2.5s linear infinite;
    }
    @keyframes gradMove { to { background-position: 200% 0; } }

    .big-heart {
      font-size: 3.8rem;
      display: inline-block;
      animation: heartbeat 1.2s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      14%      { transform: scale(1.18); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.12); }
      56%      { transform: scale(1); }
    }

    .card-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.4rem;
      color: #d63a6e;
      margin: 12px 0 4px;
      text-shadow: 0 2px 8px rgba(214,58,110,0.2);
    }

    .card-sub {
      color: #f06292;
      font-size: 0.88rem;
      letter-spacing: 2px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .message-box {
      background: linear-gradient(135deg, #fff0f5, #ffe4ec);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 24px;
      border: 1.5px dashed #f8aec0;
    }
    .message-box p {
      color: #c2185b;
      line-height: 1.85;
      font-size: 0.97rem;
    }
    .message-box .emoji-row {
      margin-top: 10px;
      font-size: 1.5rem;
      letter-spacing: 6px;
    }

    .question {
      font-size: 1.25rem;
      color: #ad1457;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .btn-group { display: flex; gap: 14px; justify-content: center; }

    #yesBtn {
      flex: 1; padding: 16px 10px;
      background: linear-gradient(135deg, #f953c6, #b91d73);
      color: #fff; border: none; border-radius: 50px;
      font-size: 1.1rem; font-family: 'Mitr', sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(185,29,115,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #yesBtn:hover { transform: scale(1.06); box-shadow: 0 10px 28px rgba(185,29,115,0.5); }

    #noBtn {
      flex: 1; padding: 16px 10px;
      background: #f3f3f3; color: #aaa;
      border: 2px solid #e0e0e0;
      border-radius: 50px;
      font-size: 1.1rem; font-family: 'Mitr', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    /* ---- Happy Screen ---- */
    #happyScreen {
      display: none;
      position: relative; z-index: 10;
      text-align: center;
      max-width: 420px; width: 95%;
      animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1);
    }
    .happy-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 50px 36px 44px;
      box-shadow: 0 24px 64px rgba(255,80,120,0.3);
    }
    .happy-emoji { font-size: 5rem; animation: bounce 0.8s ease infinite alternate; }
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-18px); }
    }
    .happy-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #d63a6e;
      margin: 16px 0 10px;
    }
    .happy-msg { color: #c2185b; font-size: 1rem; line-height: 1.8; }

    /* Burst hearts */
    .burst-heart {
      position: fixed; pointer-events: none; z-index: 999;
      font-size: 1.6rem;
      animation: burst 1s ease-out forwards;
    }
    @keyframes burst {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
    }

    /* ---- Date Lock Screen ---- */
    #dateLockScreen {
      display: none;
      position: relative; z-index: 10;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 48px 40px 40px;
      box-shadow: 0 20px 60px rgba(255,100,130,0.25);
      text-align: center;
      max-width: 360px; width: 90%;
      animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
    }
  </style>
</head>
<body>

<!-- Background hearts -->
<div class="bg-hearts" id="bgHearts"></div>

<!-- Date Lock Screen -->
<div id="dateLockScreen">
  <div class="lock-icon" id="calIcon">📅</div>
  <h2 style="font-family:'Dancing Script',cursive;font-size:1.8rem;color:#d63a6e;margin:14px 0 6px;">ยังไม่ถึงเวลา~</h2>
  <p style="color:#aaa;font-size:0.85rem;margin-bottom:20px;">การ์ดนี้จะเปิดได้ในวันที่ 20 พ.ค. 2569</p>
  <div id="countdown" style="font-size:1.5rem;font-weight:500;color:#e8538c;letter-spacing:2px;"></div>
  <p style="color:#ccc;font-size:0.78rem;margin-top:16px;">รอหน่อยนะ 🥺💕</p>
</div>

<!-- Lock Screen -->
<div id="lockScreen">
  <div class="lock-icon">🔒</div>
  <h2>ข้อความพิเศษ</h2>
  <p>กรอกรหัสผ่านเพื่อเปิดการ์ด</p>
  <div class="input-wrap">
    <input id="pwInput" type="password" placeholder="รหัสผ่าน..." maxlength="20" />
    <button id="togglePw" onclick="togglePassword()" title="แสดง/ซ่อน">👁️</button>
  </div>
  <button id="unlockBtn" onclick="unlock()">เปิดการ์ด 💌</button>
  <div id="errorMsg"></div>
</div>

<!-- Card Screen -->
<div id="cardScreen">
  <div class="envelope">
    <div class="big-heart">💖</div>
    <div class="card-title">🥺</div>
    <div class="question">เราจะมาเป็นแฟนกันไหม? 💕</div>
    <div class="btn-group">
      <button id="yesBtn" onclick="sayYes()">ได้เลย! 💗</button>
      <button id="noBtn" onmouseover="runAway()" onclick="runAway()">ไม่ล่ะ</button>
    </div>
  </div>
</div>

<!-- Happy Screen -->
<div id="happyScreen">
  <div class="happy-card">
    <div class="happy-emoji">🥰</div>
    <div class="happy-msg">
      จะดูแลเทอให้ดีที่สุดเลยนะ 💑<br/><br/>
      <strong>รักเทอมากๆ~ 💖</strong>
    </div>
  </div>
</div>

<script>
  /* ---- Password (เปลี่ยนได้ที่นี่) ---- */
  const SECRET = "207822";

  /* ---- Date unlock (เปิดได้วันที่ 20/05/2026) ---- */
  const UNLOCK_DATE = new Date("2026-05-20T00:00:00");

  function checkDateLock() {
    const now = new Date();
    const dateLock = document.getElementById("dateLockScreen");
    const lockScreen = document.getElementById("lockScreen");
    if (now < UNLOCK_DATE) {
      dateLock.style.display = "block";
      lockScreen.style.display = "none";
      updateCountdown();
      setInterval(updateCountdown, 1000);
    } else {
      dateLock.style.display = "none";
      lockScreen.style.display = "block";
    }
  }

  function updateCountdown() {
    const now = new Date();
    const diff = UNLOCK_DATE - now;
    if (diff <= 0) {
      document.getElementById("dateLockScreen").style.display = "none";
      document.getElementById("lockScreen").style.display = "block";
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById("countdown").textContent =
      (d > 0 ? d + " วัน " : "") +
      String(h).padStart(2,"0") + " : " +
      String(m).padStart(2,"0") + " : " +
      String(s).padStart(2,"0");
  }

  checkDateLock();

  /* ---- Block right-click & DevTools keys ---- */
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if (
      e.key === "F12" ||
      (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) ||
      (e.ctrlKey && e.key.toUpperCase() === "U")
    ) {
      e.preventDefault();
      e.stopPropagation();
    }
  });

  /* ---- Background floating hearts ---- */
  const emojis = ["💕","💖","💗","🌸","✨","💝","🩷","💞"];
  const bg = document.getElementById("bgHearts");
  for (let i = 0; i < 22; i++) {
    const h = document.createElement("span");
    h.className = "bg-heart";
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (0.9 + Math.random() * 1.6) + "rem";
    h.style.animationDuration = (6 + Math.random() * 10) + "s";
    h.style.animationDelay = (Math.random() * 10) + "s";
    bg.appendChild(h);
  }

  /* ---- Toggle password visibility ---- */
  let visible = false;
  function togglePassword() {
    visible = !visible;
    const inp = document.getElementById("pwInput");
    inp.type = visible ? "text" : "password";
    document.getElementById("togglePw").textContent = visible ? "🙈" : "👁️";
  }

  /* ---- Allow Enter key to unlock ---- */
  document.getElementById("pwInput").addEventListener("keydown", e => {
    if (e.key === "Enter") unlock();
  });

  /* ---- Unlock logic ---- */
  function unlock() {
    const val = document.getElementById("pwInput").value;
    if (val === SECRET) {
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("cardScreen").style.display = "block";
    } else {
      const box = document.getElementById("lockScreen");
      box.classList.remove("shake");
      void box.offsetWidth;
      box.classList.add("shake");
      const err = document.getElementById("errorMsg");
      err.textContent = "❌ รหัสผ่านไม่ถูกต้อง ลองใหม่นะ~";
      setTimeout(() => err.textContent = "", 2500);
      document.getElementById("pwInput").value = "";
      document.getElementById("pwInput").focus();
    }
  }

  /* ---- No button runs away ---- */
  let noCount = 0;
  function runAway() {
    noCount++;
    const btn = document.getElementById("noBtn");
    const vw = window.innerWidth, vh = window.innerHeight;
    const rect = btn.getBoundingClientRect();
    let nx, ny;
    const margin = 80;
    nx = Math.random() * (vw - margin * 2) + margin;
    ny = Math.random() * (vh - margin * 2) + margin;
    btn.style.position = "fixed";
    btn.style.left = nx + "px";
    btn.style.top  = ny + "px";
    btn.style.zIndex = 999;
    btn.style.margin = "0";
    // Make Yes button grow
    const yesBtn = document.getElementById("yesBtn");
    const scale = Math.min(1 + noCount * 0.08, 1.6);
    yesBtn.style.transform = `scale(${scale})`;
    if (noCount >= 4) {
      btn.style.opacity = "0.3";
      btn.textContent = "ยังไงก็ต้องตอบว่าได้! 😆";
    }
  }

  /* ---- Yes! ---- */
  function sayYes() {
    spawnBurstHearts();
    setTimeout(() => {
      document.getElementById("cardScreen").style.display = "none";
      document.getElementById("happyScreen").style.display = "block";
      // hide roaming No button
      const nb = document.getElementById("noBtn");
      if (nb) nb.style.display = "none";
    }, 400);
  }

  /* ---- Burst hearts on Yes ---- */
  function spawnBurstHearts() {
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    for (let i = 0; i < 28; i++) {
      const h = document.createElement("span");
      h.className = "burst-heart";
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const angle = Math.random() * 2 * Math.PI;
      const dist  = 100 + Math.random() * 220;
      h.style.left = cx + "px";
      h.style.top  = cy + "px";
      h.style.setProperty("--tx", Math.cos(angle) * dist + "px");
      h.style.setProperty("--ty", Math.sin(angle) * dist + "px");
      h.style.animationDelay = Math.random() * 0.25 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1200);
    }
  }
</script>
</body>
</html>
